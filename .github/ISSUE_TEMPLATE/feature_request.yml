name: Feature request
description: Describe a workflow Traceglass could improve.
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe a concrete workflow and what is difficult today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and alternatives
      description: Explain the change and any alternatives you have tried.
    validations:
      required: true
