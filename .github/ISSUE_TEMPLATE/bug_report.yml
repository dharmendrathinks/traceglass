name: Bug report
description: Report a reproducible problem with Traceglass.
body:
  - type: markdown
    attributes:
      value: "Use fictional data. Do not attach raw customer HARs, credentials or private URLs. Report vulnerabilities through SECURITY.md."
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Traceglass version, Chrome version and operating system.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include a minimal synthetic example if useful.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
